<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Car Listings | MotorVault Admin</title>
  <meta name="robots" content="noindex,nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="admin.css" />
  <script src="admin.js"></script>
  <script>checkAuth();</script>
</head>
<body class="admin-body">

  <aside class="admin-sidebar" aria-label="Admin navigation">
    <div class="sidebar-brand">
      <a href="dashboard.html" class="brand-logo">MOTOR<span class="accent">VAULT</span></a>
      <div class="sidebar-sub">Admin Panel</div>
    </div>
    <nav class="admin-nav">
      <div class="admin-nav-section">Manage</div>
      <a href="dashboard.html" class="admin-nav-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        Dashboard
      </a>
      <a href="cars.html" class="admin-nav-link is-active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l2-5a3 3 0 0 1 2.83-2h8.34A3 3 0 0 1 19 8l2 5"/><path d="M3 13h18v5a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-1H7v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><circle cx="7" cy="16" r="1"/><circle cx="17" cy="16" r="1"/></svg>
        Car Listings
      </a>
      <a href="add-car.html" class="admin-nav-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add New Car
      </a>
      <a href="bookings.html" class="admin-nav-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Test Drive Requests
      </a>
    </nav>
    <div class="sidebar-footer">
      <button type="button" id="logout-btn" class="logout-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <div class="topbar-left">
        <button type="button" id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle navigation">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h1 class="admin-page-title">Car Listings</h1>
      </div>
      <a href="add-car.html" class="btn btn-primary btn-sm">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add New Car
      </a>
    </header>

    <div class="admin-content">

      <div class="toolbar">
        <input type="text" id="search" class="input grow" placeholder="Search by make, model, year..." />
        <select id="filter-status" class="select" style="max-width: 180px;">
          <option value="">All statuses</option>
          <option value="available">Available</option>
          <option value="sold">Sold</option>
          <option value="reserved">Reserved</option>
        </select>
        <select id="filter-type" class="select" style="max-width: 180px;">
          <option value="">All types</option>
          <option value="SUV">SUV</option>
          <option value="Sedan">Sedan</option>
          <option value="Hatchback">Hatchback</option>
          <option value="Coupe">Coupe</option>
          <option value="Truck">Truck</option>
          <option value="Van">Van</option>
        </select>
      </div>

      <div class="table-wrap">
        <table class="table" id="cars-table">
          <thead>
            <tr>
              <th>Vehicle</th>
              <th>Year</th>
              <th>Mileage</th>
              <th>Price</th>
              <th>Status</th>
              <th>Featured</th>
              <th style="text-align: right;">Actions</th>
            </tr>
          </thead>
          <tbody id="cars-body"></tbody>
        </table>
      </div>

    </div>
  </div>

  <!-- Delete confirmation modal -->
  <div class="modal-backdrop" id="delete-modal" role="dialog" aria-modal="true" aria-labelledby="delete-title">
    <div class="modal">
      <h3 class="modal-title" id="delete-title">Delete this car?</h3>
      <p class="modal-text">
        You're about to permanently remove <strong id="delete-name"></strong> from the inventory.
        This action cannot be undone.
      </p>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="delete-cancel">Cancel</button>
        <button type="button" class="btn btn-primary" id="delete-confirm">Delete</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    bindLayout();

    const searchInput = document.getElementById("search");
    const statusFilter = document.getElementById("filter-status");
    const typeFilter = document.getElementById("filter-type");
    const tbody = document.getElementById("cars-body");
    const modal = document.getElementById("delete-modal");
    const deleteName = document.getElementById("delete-name");
    const deleteCancel = document.getElementById("delete-cancel");
    const deleteConfirm = document.getElementById("delete-confirm");
    const toast = document.getElementById("toast");
    let pendingDeleteId = null;

    function showToast(message, type = "success") {
      toast.textContent = message;
      toast.className = "toast is-visible " + type;
      setTimeout(() => { toast.className = "toast " + type; }, 2200);
    }

    function applyFilters(cars) {
      const q = searchInput.value.trim().toLowerCase();
      const status = statusFilter.value;
      const type = typeFilter.value;

      return cars.filter(c => {
        if (status && c.status !== status) return false;
        if (type && c.type !== type) return false;
        if (q) {
          const hay = `${c.make} ${c.model} ${c.year} ${c.color || ""} ${c.type || ""}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    function render() {
      const all = getCars();
      const cars = applyFilters(all);

      if (cars.length === 0) {
        tbody.innerHTML = `
          <tr><td colspan="7">
            <div class="empty-state">
              <h3>No cars match</h3>
              <p>${all.length === 0 ? 'Add your first car to get started.' : 'Try clearing the filters or adjusting your search.'}</p>
            </div>
          </td></tr>`;
        return;
      }

      tbody.innerHTML = cars.map(c => `
        <tr data-id="${escapeHtml(c.id)}">
          <td>
            <div style="display:flex;align-items:center;gap:0.85rem;">
              <img src="${escapeHtml(c.image)}" alt="${escapeHtml(c.make + ' ' + c.model)}" class="car-thumb" loading="lazy" />
              <div>
                <div class="cell-strong">${escapeHtml(c.make)} ${escapeHtml(c.model)}</div>
                <div class="cell-sub">${escapeHtml(c.type || '—')} · ${escapeHtml(c.color || '—')}</div>
              </div>
            </div>
          </td>
          <td>${escapeHtml(String(c.year || '—'))}</td>
          <td>${formatNumber(c.mileage)} km</td>
          <td><span class="cell-strong">${formatPrice(c.price)}</span></td>
          <td><span class="badge badge-${escapeHtml(c.status)}">${escapeHtml(c.status)}</span></td>
          <td>${c.featured ? '<span class="badge badge-featured">Featured</span>' : '<span style="color:var(--admin-muted);">—</span>'}</td>
          <td style="text-align: right;">
            <div class="row-actions">
              <a href="edit-car.html?id=${encodeURIComponent(c.id)}" class="btn btn-outline btn-sm">Edit</a>
              <button type="button" class="btn btn-danger btn-sm" data-delete="${escapeHtml(c.id)}">Delete</button>
            </div>
          </td>
        </tr>
      `).join("");
    }

    // Filter events
    [searchInput, statusFilter, typeFilter].forEach(el => {
      el.addEventListener("input", render);
      el.addEventListener("change", render);
    });

    // Delete handler (event delegation)
    tbody.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-delete]");
      if (!btn) return;
      const id = btn.getAttribute("data-delete");
      const car = getCar(id);
      if (!car) return;
      pendingDeleteId = id;
      deleteName.textContent = `${car.make} ${car.model} ${car.year}`;
      modal.classList.add("is-open");
    });

    function closeModal() {
      modal.classList.remove("is-open");
      pendingDeleteId = null;
    }

    deleteCancel.addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && modal.classList.contains("is-open")) closeModal();
    });

    deleteConfirm.addEventListener("click", () => {
      if (!pendingDeleteId) return;
      const car = getCar(pendingDeleteId);
      deleteCar(pendingDeleteId);
      closeModal();
      render();
      if (car) showToast(`Deleted ${car.make} ${car.model}`, "success");
    });

    render();
  </script>
</body>
</html>
