<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | MotorVault Admin</title>
  <meta name="robots" content="noindex,nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="admin.css" />
  <script src="admin.js"></script>
  <script>checkAuth();</script>
</head>
<body class="admin-body">

  <aside class="admin-sidebar" aria-label="Admin navigation">
    <div class="sidebar-brand">
      <a href="dashboard.html" class="brand-logo">MOTOR<span class="accent">VAULT</span></a>
      <div class="sidebar-sub">Admin Panel</div>
    </div>
    <nav class="admin-nav">
      <div class="admin-nav-section">Manage</div>
      <a href="dashboard.html" class="admin-nav-link is-active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        Dashboard
      </a>
      <a href="cars.html" class="admin-nav-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l2-5a3 3 0 0 1 2.83-2h8.34A3 3 0 0 1 19 8l2 5"/><path d="M3 13h18v5a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-1H7v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><circle cx="7" cy="16" r="1"/><circle cx="17" cy="16" r="1"/></svg>
        Car Listings
      </a>
      <a href="add-car.html" class="admin-nav-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add New Car
      </a>
      <a href="bookings.html" class="admin-nav-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Test Drive Requests
      </a>
    </nav>
    <div class="sidebar-footer">
      <button type="button" id="logout-btn" class="logout-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <div class="topbar-left">
        <button type="button" id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle navigation">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h1 class="admin-page-title">Dashboard</h1>
      </div>
      <a href="../index.html" class="view-site-btn" target="_blank" rel="noopener">
        View Site
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      </a>
    </header>

    <div class="admin-content">

      <!-- Stat cards -->
      <div class="stats-grid" id="stats-grid"></div>

      <!-- Two-column: recent cars + recent bookings -->
      <div class="dashboard-grid">
        <section class="panel">
          <div class="panel-header">
            <h2 class="panel-title">Recent Listings</h2>
            <a href="cars.html" class="btn btn-outline btn-sm">View All</a>
          </div>
          <div id="recent-cars" class="recent-list"></div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2 class="panel-title">Recent Bookings</h2>
            <a href="bookings.html" class="btn btn-outline btn-sm">View All</a>
          </div>
          <div id="recent-bookings" class="recent-list"></div>
        </section>
      </div>

    </div>
  </div>

  <script>
    bindLayout();

    function renderStats() {
      const cars = getCars();
      const bookings = getBookings();
      const available = cars.filter(c => c.status === "available").length;
      const sold = cars.filter(c => c.status === "sold").length;
      const pending = bookings.filter(b => b.status === "pending").length;

      document.getElementById("stats-grid").innerHTML = `
        <div class="stat-card">
          <div class="stat-label">Total Cars</div>
          <div class="stat-value">${cars.length}</div>
          <div class="stat-meta">All listings in inventory</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Available</div>
          <div class="stat-value">${available}</div>
          <div class="stat-meta">Ready for sale</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Sold</div>
          <div class="stat-value">${sold}</div>
          <div class="stat-meta">Marked as sold</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Pending Bookings</div>
          <div class="stat-value">${pending}</div>
          <div class="stat-meta">Awaiting confirmation</div>
        </div>
      `;
    }

    function renderRecentCars() {
      const cars = [...getCars()]
        .sort((a, b) => (b.dateAdded || "").localeCompare(a.dateAdded || ""))
        .slice(0, 4);

      const el = document.getElementById("recent-cars");
      if (cars.length === 0) {
        el.innerHTML = `<div class="empty-state"><h3>No cars yet</h3><p>Add your first listing to see it here.</p></div>`;
        return;
      }

      el.innerHTML = cars.map(c => `
        <div class="recent-row">
          <img src="${escapeHtml(c.image)}" alt="${escapeHtml(c.make + " " + c.model)}" loading="lazy" />
          <div>
            <div class="name">${escapeHtml(c.make)} ${escapeHtml(c.model)} ${escapeHtml(String(c.year))}</div>
            <div class="meta">${escapeHtml(c.type || "—")} · ${formatNumber(c.mileage)} km · Added ${formatDate(c.dateAdded)}</div>
          </div>
          <div class="right">
            <div class="name">${formatPrice(c.price)}</div>
            <div class="meta"><span class="badge badge-${escapeHtml(c.status)}">${escapeHtml(c.status)}</span></div>
          </div>
        </div>
      `).join("");
    }

    function renderRecentBookings() {
      const bookings = [...getBookings()]
        .sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""))
        .slice(0, 4);

      const el = document.getElementById("recent-bookings");
      if (bookings.length === 0) {
        el.innerHTML = `<div class="empty-state"><h3>No bookings yet</h3><p>Test drive requests will appear here.</p></div>`;
        return;
      }

      el.innerHTML = bookings.map(b => `
        <div class="recent-row">
          <div style="width:40px;height:40px;border-radius:50%;background:rgba(220,38,38,0.15);color:#fca5a5;display:flex;align-items:center;justify-content:center;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:0.95rem;flex-shrink:0;">
            ${escapeHtml((b.name || "?").trim().charAt(0).toUpperCase())}
          </div>
          <div>
            <div class="name">${escapeHtml(b.name)}</div>
            <div class="meta">${escapeHtml(b.carName || "—")} · ${formatDate(b.date)} ${escapeHtml(b.time || "")}</div>
          </div>
          <div class="right">
            <span class="badge badge-${escapeHtml(b.status)}">${escapeHtml(b.status)}</span>
          </div>
        </div>
      `).join("");
    }

    renderStats();
    renderRecentCars();
    renderRecentBookings();
  </script>
</body>
</html>
