<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | MotorVault</title>
  <meta name="robots" content="noindex,nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="admin.css" />
</head>
<body class="login-page">

  <main class="login-card" role="main">
    <div class="login-brand">MOTOR<span class="accent">VAULT</span></div>
    <p class="login-sub">Admin Panel</p>

    <h1 class="login-title">Welcome back</h1>
    <p class="login-text">Sign in with your admin password to continue.</p>

    <form id="login-form" novalidate>
      <div class="field" style="margin-bottom: 1rem;">
        <label class="label" for="password">Password</label>
        <input
          class="input"
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          placeholder="Enter admin password"
          required
        />
      </div>

      <div id="login-error" class="login-hint" style="display:none; background: rgba(220,38,38,0.15); border-color: rgba(220,38,38,0.4); color: #fecaca;">
        Incorrect password. Please try again.
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.25rem;">
        Sign In
      </button>
    </form>

    <div class="login-hint">
      Demo password: <code>motorvault2026</code>
    </div>
  </main>

  <script src="admin.js"></script>
  <script>
    // If already logged in, skip login screen
    if (sessionStorage.getItem("mv_admin_logged_in") === "true") {
      window.location.replace("dashboard.html");
    }

    const form = document.getElementById("login-form");
    const passwordInput = document.getElementById("password");
    const errorBox = document.getElementById("login-error");

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const value = passwordInput.value.trim();
      if (login(value)) {
        window.location.href = "dashboard.html";
      } else {
        errorBox.style.display = "block";
        passwordInput.value = "";
        passwordInput.focus();
      }
    });

    passwordInput.addEventListener("input", () => {
      errorBox.style.display = "none";
    });
  </script>
</body>
</html>
